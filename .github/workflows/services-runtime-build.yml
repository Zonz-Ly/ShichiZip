name: Runtime Diagnostics Build

on:
  push:
    branches: [codex/services-runtime-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Record tools and source
        run: |
          mkdir -p build/diagnostic-logs
          git rev-parse HEAD | tee build/diagnostic-logs/source.txt
          sw_vers
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      - name: Generate project
        run: |
          sh vendor/apply_7zip_patches.sh vendor/7zip
          sh vendor/apply_7zip_patches.sh vendor/7zip-zstd
          brew install xcodegen
          xcodegen generate
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build archive engine
        run: |
          zig build lib -Dvariant=mainline -Dtarget=aarch64-native -Doptimize=ReleaseFast -p build --summary all
          zig build sfx -Dvariant=mainline -Doptimize=ReleaseSmall -p build --summary all
      - name: Build complete application with temporary diagnostics
        run: |
          set -o pipefail
          xcodebuild -project ShichiZip.xcodeproj -scheme ShichiZip -configuration Debug \
            -derivedDataPath build/DerivedData -arch arm64 \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee build/diagnostic-logs/build.log
      - name: Record package metadata and signatures
        run: |
          app="build/DerivedData/Build/Products/Debug/ShichiZip.app"
          codesign --verify --deep --strict "$app"
          {
            codesign -d --verbose=4 "$app"
            for service in "$app"/Contents/Resources/FinderServices/*.bundle; do
              /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$service/Contents/Info.plist"
              codesign --verify --deep --strict "$service"
              codesign -d --verbose=4 "$service"
            done
          } > build/diagnostic-logs/signing.txt 2>&1
      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug/ShichiZip.app \
            build/ShichiZip-Diagnostics-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ShichiZip-Diagnostics-arm64.zip
          path: build/ShichiZip-Diagnostics-arm64.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Runtime-Diagnostics-Build-Logs
          path: build/diagnostic-logs
          if-no-files-found: warn
